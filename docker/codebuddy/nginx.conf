# CodeBuddy / WorkBuddy OAuth 的 HTTPS 入口（:3030）
#
# 为什么需要这一层：
#   frontend（cognee-ui，Next.js）在容器内只监听明文 3000，自身不会说 TLS；
#   而 OAuth 登录用 Secure Cookie，必须整站 HTTPS，且 .env 里回调已固定为
#   https://xx.stillgroup.net:3030/oauth/callback —— 所以必须【保留 :3030 端口号】，
#   只把该端口的内容从 HTTP 换成 HTTPS。
#
#  浏览器 --https:3030--> 本容器 443(TLS) --http--> frontend:3000   （UI 与 /oauth/callback）
#                                        \---------> cognee:8000    （/backend/*）
#
# 本文件是 docker/codebuddy/Caddyfile 的 nginx 等价实现。原版用 Caddy 的
# `tls internal`（内部 CA，浏览器不信任）且只绑 127.0.0.1，所以外部访问不到、
# 证书也不被信任；这里换成真证书 + 公网绑定。
#
# 换证：替换 certs/ 下的 .crt / .key 后 `docker compose restart codebuddy-https`。

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  # 知识图谱导入可能上传较大文件；Caddy 原版不设上限，这里给一个够用的值
  client_max_body_size 200m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Docker 内置 DNS + upstream resolve：上游容器重建换了 IP 也能自动跟上，
  # 不会像"启动时解析"那样把流量一直打到旧 IP 上。
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream codebuddy_ui {
    zone codebuddy_ui 64k;
    server frontend:3000 resolve;
  }

  upstream codebuddy_backend {
    zone codebuddy_backend 64k;
    server cognee:8000 resolve;
  }

  upstream codebuddy_mcp {
    zone codebuddy_mcp 64k;
    server cognee-mcp:8000 resolve;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/xx.stillgroup.net.crt;
    ssl_certificate_key /etc/nginx/certs/xx.stillgroup.net.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 刻意不开 HSTS：HSTS 按「主机」生效、不区分端口，一旦下发会让同主机下
    # 仍是明文的 8080（hrms）与 8866（yiran-live-report）也被强制 https，
    # 直接把那两个服务锁死。（3040 已于 2026-09-21 上了 https，不再是理由。）

    # 有人用 http:// 打 3030 时 nginx 报 497，默认只回 400「明文请求发到了
    # HTTPS 端口」，这里改成 301 跳 https。端口号写死 3030——容器内
    # $server_port 是 443，不能拿来拼对外地址。
    error_page 497 =301 https://$host:3030$request_uri;

    # ---- /backend/* -> cognee:8000（剥掉 /backend 前缀）----
    # 对应 Caddyfile 的 `handle_path /backend/*`。
    # 干净的 `/backend` 单独兜一条：否则它匹配不到 `/backend/`，会掉进下面的 catch-all 给前端。
    location = /backend {
      proxy_pass http://codebuddy_backend/;
      proxy_http_version 1.1;
      # 用 $http_host 保留 :3030 端口，后端拼绝对地址时才不会把端口丢掉
      proxy_set_header Host              $http_host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host  $http_host;

      # 后端返回的重定向统一纠到公网 HTTPS + /backend 前缀。
      # FastAPI 会按自己看到的 Host/协议拼绝对地址，实测吐的是
      # http://xx.stillgroup.net/api/v1/... —— 缺端口、缺 /backend 前缀、还是 http，
      # 不纠正的话浏览器会跳出前缀并走明文，直接 404。
      # 顺序有讲究：先放行已经是正确公网地址的，避免被重复加上前缀。
      proxy_redirect ~^https://xx\.stillgroup\.net:3030/backend(/.*)?$ https://xx.stillgroup.net:3030/backend$1;
      # Only rewrite our API redirects; preserve external OAuth authorization URLs.
      proxy_redirect ~^https?://(?:xx\.stillgroup\.net|cognee|codebuddy_backend|127\.0\.0\.1|localhost)(?::\d+)?(/api(?:/.*|\?.*)?)$ https://xx.stillgroup.net:3030/backend$1;
      proxy_redirect ~^(/[^/].*)$ https://xx.stillgroup.net:3030/backend$1;

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /backend/ {
      # 末尾带 / 的 proxy_pass 会把匹配到的 /backend/ 前缀替换成 /，即剥掉前缀
      proxy_pass http://codebuddy_backend/;
      proxy_http_version 1.1;
      # 用 $http_host 保留 :3030 端口，后端拼绝对地址时才不会把端口丢掉
      proxy_set_header Host              $http_host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host  $http_host;

      # 同 location = /backend，规则说明见上
      proxy_redirect ~^https://xx\.stillgroup\.net:3030/backend(/.*)?$ https://xx.stillgroup.net:3030/backend$1;
      # Only rewrite our API redirects; preserve external OAuth authorization URLs.
      proxy_redirect ~^https?://(?:xx\.stillgroup\.net|cognee|codebuddy_backend|127\.0\.0\.1|localhost)(?::\d+)?(/api(?:/.*|\?.*)?)$ https://xx.stillgroup.net:3030/backend$1;
      proxy_redirect ~^(/[^/].*)$ https://xx.stillgroup.net:3030/backend$1;

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # ---- /mcp -> cognee-mcp:8000（与 CPD 一致：配置页 /mcp-access，协议口 /mcp）----
    location = /mcp {
      proxy_pass http://codebuddy_mcp/mcp;
      proxy_http_version 1.1;
      proxy_set_header Host              $http_host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host  $http_host;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /mcp/ {
      proxy_pass http://codebuddy_mcp/mcp/;
      proxy_http_version 1.1;
      proxy_set_header Host              $http_host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host  $http_host;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # legacy alias kept for older copied configs
    location /cognee-mcp/ {
      proxy_pass http://codebuddy_mcp/;
      proxy_http_version 1.1;
      proxy_set_header Host              $http_host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host  $http_host;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # ---- 其余全部 -> frontend:3000（含 /mcp-access 与 /oauth/callback）----
    location / {
      proxy_pass http://codebuddy_ui;
      proxy_http_version 1.1;
      proxy_set_header Host              $http_host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host  $http_host;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
